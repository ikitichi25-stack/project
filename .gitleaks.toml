title = "SecureShop Gitleaks config"
rules = [
  {id = "generic-api-key", regex = '''(?i)(api_key|api-key|apikey|authorization|auth_token|access_token)\s*[:=]\s*['\"]?[A-Za-z0-9\-\_\=]{20,}['\"]?'''},
  {id = "generic-secret", regex = '''(?i)(secret|password|passwd|jwt_secret|secret_key)\s*[:=]\s*['\"]?[A-Za-z0-9\-\_\=]{10,}['\"]?'''}
]
allowlist = [
  'JWT_SECRET'
]
